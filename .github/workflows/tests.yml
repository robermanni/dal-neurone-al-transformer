name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa le dipendenze
        run: pip install -r requirements.txt
      - name: Test delle soluzioni di riferimento
        run: python -m pytest
      - name: Esecuzione completa dei notebook
        run: python -m pytest --nbmake moduli
